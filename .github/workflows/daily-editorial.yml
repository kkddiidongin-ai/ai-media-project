# AI마중 DAILY — Shadow Mode (Phase 7.1.2) · 수동 Draft Mode (Phase 7.1.3) · 수집 안정화·백필 (Phase 7.1.5) · 무제한 수집·대기열 (Phase 7.2)
#
# Phase 7.2: 기사 '건수' 상한 없음. 배치를 넘는 일은 처리 대기열(ingest/log/pipeline-queue.json)에 남겨 다음 실행이 먼저 처리한다.
#   대기열·처리 기록은 Actions 캐시 + automation/pipeline-state 브랜치(캐시가 지워져도 남는 기록)로 이어 쓴다.
#   무료 원고 생성(Gemini 무료 등급)은 Variable DAILY_FREE_DRAFT_ENABLED=true + Secret GEMINI_API_KEY + DAILY_GEMINI_FREE_TIER_CONFIRMED=true일 때만.
#   자동 발행은 Variable AUTO_PUBLISH_ENABLED=true일 때만 별도 발행 workflow(publish.yml)를 부른다 (기본 꺼짐).
#
# 예약 실행(매일 07:00 KST): 언제나 shadow — 공식 출처 수집 → 중복 판정 → 선정 → 근거 확인 → 보고서. LLM 호출 없음.
# 수동 실행(Run workflow)에서 mode=draft를 고른 경우에만: 검증된 발행 추천 후보에 AI 초안 + 자동 QA (편집자 검토용).
#   ANTHROPIC_API_KEY(Secret)는 draft일 때만 넘긴다. Secret이 없으면 초안 없이 안내만 하고 나머지는 shadow처럼.
# 하지 않는 일: 기사 발행(content/), 자동 merge, master push, 배포, 뉴스레터 생성·발송.
#
# 결과를 남기는 곳 (PR이 권한 때문에 실패해도 보고서는 반드시 남는다):
#   1) 실행 화면의 Summary (보고서 본문)
#   2) Artifact  daily-report-<날짜>  (run.json · report.md · candidates/) — 같은 날짜의 예전 artifact는 지우고 하나만 둔다
#   3) automation/daily-<날짜> 브랜치 + PR (권한이 있을 때만, 같은 날짜는 같은 브랜치·같은 PR을 갱신)
#
# 켜기/끄기(킬 스위치): Settings → Secrets and variables → Actions → Variables
#   DAILY_AUTOMATION_ENABLED = true 일 때만 실행. 지우거나 다른 값이면 job 자체를 건너뛴다.
# 일정: 매일 22:07 UTC = 한국 시간 07:07 (정기) + 10:07 UTC = 19:07 (추가 실행). GitHub schedule은 정시 실행을 보장하지 않는다 (2026-10-08~12 실측: 약 2.5~3.5시간 지연).
#   정각(:00)은 GitHub 예약 실행이 몰리는 시각이라 피했다. 그래도 정확한 실행 시각은 보장되지 않는다.
#   그래서 시각 대신 '따라잡기'로 누락을 막는다: 수집 시작일 = 기본 창(기준일-3, 72시간+)과 마지막 실행일(automation/daily-* 브랜치·캐시 기록) 중
#   이른 날 (최대 7일). 실행이 빠진 날의 발표도 다음 실행이 다시 본다. 이미 처리한 항목은 처리 기록으로 다시 추천하지 않는다.
# 백필(Phase 7.1.5): Run workflow에서 from·to(발표일 기준, 최대 14일)를 넣으면 그 기간을 다시 수집한다 (언제나 shadow).
#   결과는 ingest/daily/backfill-<from>_<to>/ · 브랜치 automation/daily-backfill-<from>_<to> · 같은 기간은 같은 PR.

name: AI마중 DAILY

on:
  schedule:
    - cron: "7 22 * * *"
    - cron: "7 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 (한국 시간 YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string
      mode:
        description: "shadow(기본, LLM 없음) 또는 draft(AI 초안 + QA, 유료 API 호출)"
        required: false
        type: choice
        default: shadow
        options:
          - shadow
          - draft
      from:
        description: "백필 시작일 (발표일 기준 YYYY-MM-DD). to와 함께 넣으면 그 기간만 다시 수집 (shadow)"
        required: false
        type: string
      to:
        description: "백필 종료일 (발표일 기준 YYYY-MM-DD, 최대 14일)"
        required: false
        type: string

permissions:
  contents: write # automation/daily-* 브랜치에만 push
  pull-requests: write
  actions: write # 같은 날짜의 예전 보고서 artifact 정리

concurrency:
  group: aimajung-daily
  cancel-in-progress: false

jobs:
  daily:
    if: ${{ vars.DAILY_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # rid = 결과 폴더·브랜치·artifact 이름 (날짜별 DAILY는 날짜, 백필은 backfill-<from>_<to>)
      - name: Date (KST)
        id: d
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [ -n "$INPUT_FROM$INPUT_TO" ]; then
            [[ "$INPUT_FROM" =~ $re && "$INPUT_TO" =~ $re ]] || { echo "백필은 from·to 둘 다 YYYY-MM-DD"; exit 1; }
            echo "date=$INPUT_TO" >> "$GITHUB_OUTPUT"
            echo "rid=backfill-${INPUT_FROM}_${INPUT_TO}" >> "$GITHUB_OUTPUT"
            echo "backfill=true" >> "$GITHUB_OUTPUT"
          else
            D="${INPUT_DATE:-$(TZ=Asia/Seoul date +%F)}"
            [[ "$D" =~ $re ]] || { echo "bad date: $D"; exit 1; }
            echo "date=$D" >> "$GITHUB_OUTPUT"
            echo "rid=$D" >> "$GITHUB_OUTPUT"
            echo "backfill=false" >> "$GITHUB_OUTPUT"
          fi

      # 예약 실행은 언제나 shadow. draft는 수동 실행에서 직접 고른 경우에만
      - name: Mode
        id: m
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          BACKFILL: ${{ steps.d.outputs.backfill }}
          FREE_DRAFT: ${{ vars.DAILY_FREE_DRAFT_ENABLED }}
        run: |
          M=shadow
          P=none
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "draft" ] && [ "$BACKFILL" != "true" ]; then M=draft; P=anthropic; fi
          # Phase 7.2: 무료 원고 생성은 운영자가 켠 경우에만 (예약 실행 포함). 유료(anthropic)는 여전히 수동 draft에서만
          if [ "$P" = "none" ] && [ "$FREE_DRAFT" = "true" ] && [ "$BACKFILL" != "true" ]; then M=draft; P=gemini; fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "provider=$P" >> "$GITHUB_OUTPUT"
          echo "mode: $M · provider: $P (event: $EVENT)"

      # 같은 날짜를 다시 돌릴 때 이미 만든 초안·근거를 이어 쓴다 (같은 후보를 다시 생성·과금하지 않게)
      - name: Restore earlier results for this date
        continue-on-error: true
        env:
          D: ${{ steps.d.outputs.rid }}
        run: |
          B="automation/daily-$D"
          mkdir -p "$RUNNER_TEMP/daily" "$RUNNER_TEMP/restore"
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then
            git fetch origin "$B"
            git -C "$GITHUB_WORKSPACE" archive FETCH_HEAD "site/ingest/daily/$D" | tar -x -C "$RUNNER_TEMP/restore" || true
            if [ -d "$RUNNER_TEMP/restore/site/ingest/daily/$D" ]; then cp -R "$RUNNER_TEMP/restore/site/ingest/daily/$D" "$RUNNER_TEMP/daily/"; echo "restored $B"; fi
          fi

      # 처리 기록·소스 상태·처리 대기열: 먼저 automation/pipeline-state 브랜치(오래 남는 기록)에서, 없으면 캐시에서
      - name: Restore pipeline state (branch)
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin automation/pipeline-state >/dev/null; then
            git fetch origin automation/pipeline-state
            mkdir -p ingest/log
            for f in daily-processed.json daily-sources.json pipeline-queue.json; do
              git show "FETCH_HEAD:site/ingest/log/$f" > "ingest/log/$f" 2>/dev/null || rm -f "ingest/log/$f"
            done
            echo "restored pipeline state"
          fi

      # 같은 URL을 날마다 다시 처리하지 않도록 처리 기록을 캐시로 이어 쓴다 (브랜치 기록이 없을 때의 대비)
      - name: Restore processed index
        uses: actions/cache/restore@v4
        with:
          path: |
            site/ingest/log/daily-processed.json
            site/ingest/log/daily-sources.json
            site/ingest/log/pipeline-queue.json
          key: daily-processed-${{ github.run_id }}
          restore-keys: daily-processed-

      - name: Automation QA (fixtures, no network)
        run: npm run qa:daily

      # 따라잡기: 마지막으로 결과를 남긴 날짜별 DAILY 브랜치 (캐시가 지워져도 남는 기록). 백필에는 쓰지 않음
      - name: Last run (catch-up)
        id: last
        if: steps.d.outputs.backfill != 'true'
        continue-on-error: true
        env:
          D: ${{ steps.d.outputs.date }}
        run: |
          L=$(git ls-remote --heads origin 'automation/daily-20*' | sed -E 's#.*refs/heads/automation/daily-##' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | awk -v d="$D" '$1 < d' | sort | tail -1)
          echo "date=$L" >> "$GITHUB_OUTPUT"
          echo "last run branch: ${L:-없음}"

      # shadow: LLM 키를 넘기지 않고 공급자 none. draft(수동)에서만 키·anthropic
      - name: Daily run
        id: run
        env:
          DAILY_AUTOMATION_ENABLED: ${{ vars.DAILY_AUTOMATION_ENABLED }}
          DAILY_MODE: ${{ steps.m.outputs.mode }}
          DAILY_LLM_PROVIDER: ${{ steps.m.outputs.provider }}
          ANTHROPIC_API_KEY: ${{ steps.m.outputs.provider == 'anthropic' && github.event_name == 'workflow_dispatch' && secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ steps.m.outputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          DAILY_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.DAILY_GEMINI_FREE_TIER_CONFIRMED }}
          DAILY_GEMINI_MODEL: ${{ vars.DAILY_GEMINI_MODEL }}
          DAILY_TIME_BUDGET_MIN: ${{ vars.DAILY_TIME_BUDGET_MIN || '40' }}
          DAILY_MAX_ITEMS_PER_SOURCE: ${{ vars.DAILY_MAX_ITEMS_PER_SOURCE }}
          DAILY_LLM_MODEL: ${{ vars.DAILY_LLM_MODEL }}
          DAILY_LLM_EFFORT: ${{ vars.DAILY_LLM_EFFORT }}
          DAILY_LLM_PRICE_INPUT: ${{ vars.DAILY_LLM_PRICE_INPUT }}
          DAILY_LLM_PRICE_OUTPUT: ${{ vars.DAILY_LLM_PRICE_OUTPUT }}
          DAILY_MAX_COST_USD: ${{ vars.DAILY_MAX_COST_USD }}
          DAILY_MAX_LLM_CALLS: ${{ vars.DAILY_MAX_LLM_CALLS }}
          DAILY_MAX_PUBLISH: ${{ vars.DAILY_MAX_PUBLISH }}
          DAILY_MAX_EVIDENCE_FETCHES: ${{ vars.DAILY_MAX_EVIDENCE_FETCHES }}
          DAILY_LAST_RUN_DATE: ${{ steps.last.outputs.date }}
          D: ${{ steps.d.outputs.date }}
          BACKFILL: ${{ steps.d.outputs.backfill }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            npm run daily:backfill -- --from "$INPUT_FROM" --to "$INPUT_TO" --out "$RUNNER_TEMP/daily"
          else
            npm run daily:run -- --date "$D" --out "$RUNNER_TEMP/daily"
          fi

      - name: Save processed index
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            site/ingest/log/daily-processed.json
            site/ingest/log/daily-sources.json
            site/ingest/log/pipeline-queue.json
          key: daily-processed-${{ github.run_id }}

      # 오래 남는 기록: 처리 기록·소스 상태·대기열을 automation/pipeline-state 브랜치에 커밋 (master에는 쓰지 않음, force push 없음)
      - name: Save pipeline state (branch)
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/state-wt"
          git config user.name "aimajung-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin automation/pipeline-state >/dev/null; then
            git fetch origin automation/pipeline-state
            git worktree add -B pipeline-state "$W" FETCH_HEAD
          else
            git worktree add --detach "$W"
            git -C "$W" checkout --orphan pipeline-state
            git -C "$W" rm -rfq .
          fi
          mkdir -p "$W/site/ingest/log"
          for f in daily-processed.json daily-sources.json pipeline-queue.json; do [ -f "ingest/log/$f" ] && cp "ingest/log/$f" "$W/site/ingest/log/"; done
          git -C "$W" add -f site/ingest/log
          if git -C "$W" diff --cached --quiet; then echo "변경 없음"; else git -C "$W" commit -m "chore(daily): pipeline state ${{ steps.d.outputs.rid }}" && git -C "$W" push origin HEAD:refs/heads/automation/pipeline-state; fi
          git worktree remove --force "$W"

      # 보고서는 실행 화면 Summary에 항상 남긴다
      - name: Job summary
        if: always() && steps.run.outcome != 'skipped'
        env:
          D: ${{ steps.d.outputs.rid }}
        run: |
          F="$RUNNER_TEMP/daily/$D/report.md"
          if [ -f "$F" ]; then cat "$F" >> "$GITHUB_STEP_SUMMARY"; else echo "보고서 없음 (실행 실패 — 로그 확인)" >> "$GITHUB_STEP_SUMMARY"; fi

      # 같은 날짜의 예전 artifact를 지우고 하나만 남긴다 (권한이 없으면 건너뜀)
      - name: Remove older report artifacts for this date
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.d.outputs.rid }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?name=daily-report-$D&per_page=100" --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' \
            | while read -r ID; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID"; done

      # 자동 생성 초안 → 편집 원고(editorial-drafts.json). 원고가 없으면 아무것도 하지 않는다
      - name: Export drafts
        id: exp
        if: always() && steps.run.outcome == 'success'
        continue-on-error: true
        env:
          D: ${{ steps.d.outputs.rid }}
        run: |
          [ -d "$RUNNER_TEMP/daily/$D/drafts" ] || { echo "drafts=0" >> "$GITHUB_OUTPUT"; exit 0; }
          node scripts/pipeline/export-drafts.mjs "$RUNNER_TEMP/daily/$D"

      - name: Upload report artifact (fallback)
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ steps.d.outputs.rid }}
          path: ${{ runner.temp }}/daily/${{ steps.d.outputs.rid }}
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      # PR은 권한이 있을 때만. 실패해도 위의 Summary·artifact로 보고서는 남는다
      - name: Branch + PR (never master)
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.d.outputs.rid }}
          M: ${{ steps.m.outputs.mode }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/daily/$D"
          [ -f "$SRC/report.md" ] || { echo "보고서 없음"; exit 0; }
          B="automation/daily-$D"
          case "$B" in automation/daily-*) ;; *) echo "unsafe branch"; exit 1;; esac
          git config user.name "aimajung-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked >/dev/null || true
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then
            git fetch origin "$B"
            git checkout -B "$B" "origin/$B"
          else
            git checkout -B "$B" "origin/${{ github.event.repository.default_branch }}"
          fi
          mkdir -p "ingest/daily/$D"
          cp -R "$SRC/." "ingest/daily/$D/"
          git add "ingest/daily/$D"
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(daily): AI마중 DAILY $D ($M)"
            git push origin "HEAD:refs/heads/$B"
          fi
          PR=$(gh pr list --head "$B" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$B" --title "AI마중 DAILY $D ($M · 편집자 검토)" --body-file "ingest/daily/$D/report.md"
          else
            gh pr edit "$PR" --title "AI마중 DAILY $D ($M · 편집자 검토)" --body-file "ingest/daily/$D/report.md"
          fi

      # 자동 발행: 운영자가 AUTO_PUBLISH_ENABLED=true로 켠 경우에만 발행 workflow를 부른다 (기본 꺼짐).
      # 발행 workflow는 'production-publish' Environment로 보호된다 (Required reviewers를 걸면 사람이 한 번 더 승인)
      - name: Auto publish (opt-in)
        if: always() && vars.AUTO_PUBLISH_ENABLED == 'true' && steps.exp.outputs.publishable != '' && steps.exp.outputs.publishable != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.d.outputs.rid }}
        run: |
          gh workflow run publish.yml --ref "${{ github.event.repository.default_branch }}" \
            -f drafts_ref="automation/daily-$D" -f drafts_path="site/ingest/daily/$D/drafts/editorial-drafts.json" -f mode=auto -f deploy="${{ vars.AUTO_DEPLOY_ENABLED == 'true' }}"
