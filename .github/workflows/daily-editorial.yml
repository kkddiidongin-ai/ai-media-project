# AI마중 DAILY — Shadow Mode (Phase 7.1.2)
#
# 하는 일: 공식 출처 수집 → 중복 판정 → 선정 → 근거 확인 → 보고서 (Shadow Mode)
# 하지 않는 일: LLM 원고 생성, 기사 발행(content/), master push, 배포, 뉴스레터 생성·발송.
#
# 결과를 남기는 곳 (PR이 권한 때문에 실패해도 보고서는 반드시 남는다):
#   1) 실행 화면의 Summary (보고서 본문)
#   2) Artifact  daily-report-<날짜>  (run.json · report.md · candidates/) — 같은 날짜의 예전 artifact는 지우고 하나만 둔다
#   3) automation/daily-<날짜> 브랜치 + PR (권한이 있을 때만, 같은 날짜는 같은 브랜치·같은 PR을 갱신)
#
# 켜기/끄기(킬 스위치): Settings → Secrets and variables → Actions → Variables
#   DAILY_AUTOMATION_ENABLED = true 일 때만 실행. 지우거나 다른 값이면 job 자체를 건너뛴다.
# 일정: 매일 22:00 UTC = 한국 시간 07:00. GitHub schedule은 정시 실행을 보장하지 않는다 (수 분~수십 분 늦거나 드물게 건너뜀).

name: AI마중 DAILY

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 (한국 시간 YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string

permissions:
  contents: write # automation/daily-* 브랜치에만 push
  pull-requests: write
  actions: write # 같은 날짜의 예전 보고서 artifact 정리

concurrency:
  group: aimajung-daily
  cancel-in-progress: false

jobs:
  daily:
    if: ${{ vars.DAILY_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Date (KST)
        id: d
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          D="${INPUT_DATE:-$(TZ=Asia/Seoul date +%F)}"
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date: $D"; exit 1; }
          echo "date=$D" >> "$GITHUB_OUTPUT"

      # 같은 URL을 날마다 다시 처리하지 않도록 처리 기록을 캐시로 이어 쓴다
      - name: Restore processed index
        uses: actions/cache/restore@v4
        with:
          path: site/ingest/log/daily-processed.json
          key: daily-processed-${{ github.run_id }}
          restore-keys: daily-processed-

      - name: Automation QA (fixtures, no network)
        run: npm run qa:daily

      # Shadow Mode: LLM 키를 넘기지 않고, 공급자도 none으로 고정한다
      - name: Daily run (shadow)
        id: run
        env:
          DAILY_AUTOMATION_ENABLED: ${{ vars.DAILY_AUTOMATION_ENABLED }}
          DAILY_MODE: shadow
          DAILY_LLM_PROVIDER: none
          DAILY_MAX_PUBLISH: ${{ vars.DAILY_MAX_PUBLISH }}
          DAILY_MAX_EVIDENCE_FETCHES: ${{ vars.DAILY_MAX_EVIDENCE_FETCHES }}
        run: npm run daily:run -- --date "${{ steps.d.outputs.date }}" --out "$RUNNER_TEMP/daily"

      - name: Save processed index
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: site/ingest/log/daily-processed.json
          key: daily-processed-${{ github.run_id }}

      # 보고서는 실행 화면 Summary에 항상 남긴다
      - name: Job summary
        if: always() && steps.run.outcome != 'skipped'
        env:
          D: ${{ steps.d.outputs.date }}
        run: |
          F="$RUNNER_TEMP/daily/$D/report.md"
          if [ -f "$F" ]; then cat "$F" >> "$GITHUB_STEP_SUMMARY"; else echo "보고서 없음 (실행 실패 — 로그 확인)" >> "$GITHUB_STEP_SUMMARY"; fi

      # 같은 날짜의 예전 artifact를 지우고 하나만 남긴다 (권한이 없으면 건너뜀)
      - name: Remove older report artifacts for this date
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.d.outputs.date }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?name=daily-report-$D&per_page=100" --jq '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id' \
            | while read -r ID; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID"; done

      - name: Upload report artifact (fallback)
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ steps.d.outputs.date }}
          path: ${{ runner.temp }}/daily/${{ steps.d.outputs.date }}
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      # PR은 권한이 있을 때만. 실패해도 위의 Summary·artifact로 보고서는 남는다
      - name: Branch + PR (never master)
        if: always() && steps.run.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.d.outputs.date }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/daily/$D"
          [ -f "$SRC/report.md" ] || { echo "보고서 없음"; exit 0; }
          B="automation/daily-$D"
          case "$B" in automation/daily-*) ;; *) echo "unsafe branch"; exit 1;; esac
          git config user.name "aimajung-daily[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked >/dev/null || true
          if git ls-remote --exit-code --heads origin "$B" >/dev/null; then
            git fetch origin "$B"
            git checkout -B "$B" "origin/$B"
          else
            git checkout -B "$B" "origin/${{ github.event.repository.default_branch }}"
          fi
          mkdir -p "ingest/daily/$D"
          cp -R "$SRC/." "ingest/daily/$D/"
          git add "ingest/daily/$D"
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(daily): AI마중 DAILY $D (shadow)"
            git push origin "HEAD:refs/heads/$B"
          fi
          PR=$(gh pr list --head "$B" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$B" --title "AI마중 DAILY $D (shadow · 승인 대기)" --body-file "ingest/daily/$D/report.md"
          else
            gh pr edit "$PR" --body-file "ingest/daily/$D/report.md"
          fi
